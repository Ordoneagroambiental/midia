name: Atualizar Radar Ordone

on:
  workflow_dispatch:
  schedule:
    # Atualiza a cada 2 horas; horários em UTC.
    - cron: '27 */2 * * *'
  push:
    paths:
      - 'scripts/atualizar_radar.py'
      - 'dados/radar_config.json'
      - 'dados/perfil_ordone.json'
      - '.github/workflows/atualizar-radar.yml'

permissions:
  contents: write

concurrency:
  group: radar-ordone-main
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --retries 5 --timeout 60 requests beautifulsoup4 pypdf

      - name: Teste interno do radar
        run: python scripts/atualizar_radar.py --self-test

      - name: Coleta pública
        run: python scripts/atualizar_radar.py

      - name: Commit se houver mudança
        run: |
          git config user.name "ordone-radar"
          git config user.email "actions@users.noreply.github.com"
          git add dados/radar_oportunidades.json
          if git diff --cached --quiet; then
            echo "Sem mudanças no radar."
          else
            git commit -m "Atualiza Radar Ordone"
            for tentativa in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Radar publicado com sucesso."
                exit 0
              fi
              echo "Tentativa $tentativa falhou; atualizando o repositório antes de repetir."
              sleep $((tentativa * 3))
            done
            echo "Não foi possível publicar o Radar após 3 tentativas."
            exit 1
          fi
